<!doctype html><html><head><meta charset="utf-8"><style>
body{margin:0;width:1200px;height:1200px;background:#F4EFE6;font-family:Inter,sans-serif;color:#2B2B2B;display:flex;flex-direction:column;justify-content:center;padding:0 90px;box-sizing:border-box}
h1{font-family:Georgia,serif;font-size:76px;margin:0 0 50px}
.b{border-radius:26px;padding:34px 40px;font-size:40px;font-weight:700;margin-bottom:28px;line-height:1.25}
.g{background:#DCE8D5;border:4px solid #8FA98B}.y{background:#FFF1C9;border:4px solid #E3C567}.r{background:#F6D5CC;border:4px solid #C0563A}
.b span{display:block;font-weight:400;font-size:32px;margin-top:6px}
.brand{position:absolute;bottom:40px;right:60px;font-family:Georgia,serif;font-style:italic;font-size:30px;color:#8FA98B}
</style></head><body><h1>Follow the colour</h1>
<div class="b g">GREEN: You're fine.<span>Bills covered. Add the extra to your cushion.</span></div>
<div class="b y">YELLOW: Slow week.<span>Take the gap from your cushion. That's what it's for.</span></div>
<div class="b r">RED: Cushion can't cover it.<span>Pay bills first, spend only what the sheet shows.</span></div>
<div class="brand">The Uneven Paycheck Kit</div></body></html>
