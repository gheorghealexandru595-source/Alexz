<!doctype html><html><head><meta charset="utf-8"><style>
body{margin:0;width:1200px;height:1200px;background:#F4EFE6;font-family:Inter,sans-serif;color:#2B2B2B;overflow:hidden}
.tag{position:absolute;top:70px;left:80px;background:#C0563A;color:#fff;font-weight:800;font-size:34px;padding:12px 26px;border-radius:40px;letter-spacing:2px}
